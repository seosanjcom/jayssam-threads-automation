name: Lifemagazine Threads Automation

on:
  schedule:
    - cron: "0 11 * * *"
    # KST 22:30 - collect two low-risk Coupang Partners candidates and prepare tomorrow's posts.
    - cron: "30 13 * * *"
    - cron: "*/10 * * * *"
    # KST 11:30, 18:00 - publish only safe pre-approved daily drafts.
    - cron: "30 2 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - approval_check
          - publish
          - product_queue
          - product_drafts
          - auto_product_drafts
          - auto_product_drafts_remaining
          - health
          - product_lookup_test
          - delete_posts
      threads_media_ids:
        description: "Comma-separated Threads post/reply IDs to delete"
        required: false
        type: string
      product_keyword:
        description: "Product keyword for a safe Coupang Partners API lookup test"
        required: false
        type: string
      draft_path:
        description: "Draft JSON path for preview mode"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: lifemagazine-threads-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.LIFEMAGAZINE_THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: "me"
      THREADS_APP_ID: ${{ secrets.LIFEMAGAZINE_THREADS_APP_ID }}
      THREADS_APP_SECRET: ${{ secrets.LIFEMAGAZINE_THREADS_APP_SECRET }}
      THREADS_ACCOUNT_HANDLE: "@lifemagazine_"
      THREADS_AUTO_PUBLISH: "true"
      THREADS_SAFETY_MODE: "true"
      THREADS_DAILY_POST_LIMIT: "2"
      THREADS_MIN_INTERVAL_HOURS: "5"
      THREADS_PUBLISH_WAIT_MS: "30000"
      THREADS_VERIFY_PROFILE_BEFORE_PUBLISH: "true"
      THREADS_EXPECTED_USERNAME: "lifemagazine_"
      THREADS_PUBLISH_LOG: "outputs/lifemagazine/meta-publish-log.json"
      THREADS_REQUIRE_MEDIA: "false"
      THREADS_REPLY_PERMISSION_CONFIRMED: "true"
      THREADS_CAROUSEL_ENABLED: "false"
      LIFEMAGAZINE_TELEGRAM_BOT_TOKEN: ${{ secrets.LIFEMAGAZINE_TELEGRAM_BOT_TOKEN }}
      LIFEMAGAZINE_TELEGRAM_CHAT_ID: ${{ secrets.LIFEMAGAZINE_TELEGRAM_CHAT_ID }}
      COUPANG_PARTNERS_ACCESS_KEY: ${{ secrets.COUPANG_PARTNERS_ACCESS_KEY }}
      COUPANG_PARTNERS_SECRET_KEY: ${{ secrets.COUPANG_PARTNERS_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate scripts
        run: |
          node --check scripts/generate_lifemagazine_draft.mjs
          node --check scripts/validate_lifemagazine_draft.mjs
          node --check scripts/threads_studio_server.mjs
          node --check scripts/send_lifemagazine_preview_telegram.mjs
          node --check scripts/telegram_check_lifemagazine_approvals.mjs
          node --check scripts/lifemagazine_product_candidates.mjs
          node --check scripts/coupang_partners_api.mjs
          node --check scripts/test_coupang_partners_lookup.mjs
          node --check scripts/product_link_resolver.mjs
          node --check scripts/lifemagazine_telegram_product_queue.mjs
          node --check scripts/lifemagazine_visual_policy.mjs
          node --check scripts/generate_lifemagazine_product_daily.mjs
          node --check scripts/publish_lifemagazine_latest_approved.mjs
          node --check scripts/ensure_lifemagazine_due_draft.mjs
          node --test scripts/test_lifemagazine_due_draft.mjs
          node --check scripts/threads_publish.mjs
          node --check scripts/delete_threads_posts.mjs
          node --test scripts/test_lifemagazine_draft.mjs

      - name: Send Telegram preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        run: |
          if [[ -z "${{ inputs.draft_path }}" ]]; then
            echo "draft_path is required for preview mode"
            exit 1
          fi
          node scripts/validate_lifemagazine_draft.mjs "${{ inputs.draft_path }}"
          node scripts/send_lifemagazine_preview_telegram.mjs "${{ inputs.draft_path }}"

      - name: Check Telegram approval
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'approval_check') || (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *')
        run: node scripts/telegram_check_lifemagazine_approvals.mjs

      - name: Send product queue reminder
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'product_queue') || (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *')
        run: node scripts/lifemagazine_telegram_product_queue.mjs

      - name: Generate manual product drafts for review
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'product_drafts'
        run: node scripts/generate_lifemagazine_product_daily.mjs --send-preview

      - name: Generate safe automatic Coupang drafts for the next day
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'auto_product_drafts') || (github.event_name == 'schedule' && github.event.schedule == '30 13 * * *')
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            node scripts/generate_lifemagazine_product_daily.mjs --tomorrow --auto-approve --send-auto-notice
          else
            node scripts/generate_lifemagazine_product_daily.mjs --auto-approve --send-auto-notice
          fi

      - name: Generate safe automatic Coupang draft for today's remaining slot
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'auto_product_drafts_remaining'
        run: node scripts/generate_lifemagazine_product_daily.mjs --remaining-today --auto-approve --send-preview

      - name: Ensure due Lifemagazine draft
        # GitHub의 특정 시각 cron이 지연되거나 후보 생성이 누락되어도,
        # 현재 due 슬롯에만 안전한 Coupang 후보 초안을 자동 복구한다.
        if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *'
        run: node scripts/ensure_lifemagazine_due_draft.mjs
      - name: Publish latest approved
        # 게시 스크립트가 scheduled_publish_at과 일일 한도를 검증하므로,
        # 예정 전에는 안전하게 건너뛴다.
        if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || github.event_name == 'schedule'
        run: node scripts/publish_lifemagazine_latest_approved.mjs

      - name: Delete corrected Lifemagazine posts
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'delete_posts'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.LIFEMAGAZINE_THREADS_ACCESS_TOKEN }}
          THREADS_EXPECTED_USERNAME: "lifemagazine_"
          THREADS_DELETE_REASON: "operator requested correction: unverified product details"
        run: |
          if [[ -z "${{ inputs.threads_media_ids }}" ]]; then
            echo "threads_media_ids is required for delete_posts mode"
            exit 1
          fi
          node scripts/delete_threads_posts.mjs "${{ inputs.threads_media_ids }}"

      - name: Test Coupang Partners product lookup
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'product_lookup_test'
        run: |
          if [[ -z "${{ inputs.product_keyword }}" ]]; then
            echo "product_keyword is required for product_lookup_test mode"
            exit 1
          fi
          node scripts/test_coupang_partners_lookup.mjs "${{ inputs.product_keyword }}"

      - name: Health
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'health'
        run: |
          node --test scripts/test_lifemagazine_draft.mjs
          echo "lifemagazine health ok"

      - name: Commit lifemagazine results
        if: (github.event_name == 'workflow_dispatch' && (inputs.mode == 'preview' || inputs.mode == 'approval_check' || inputs.mode == 'publish' || inputs.mode == 'product_drafts' || inputs.mode == 'auto_product_drafts' || inputs.mode == 'auto_product_drafts_remaining' || inputs.mode == 'delete_posts')) || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/lifemagazine inputs/lifemagazine
          git commit -m "Record Lifemagazine automation result $(TZ=Asia/Seoul date +%F-%H%M)" || true
          git pull --rebase
          git push
