name: Blog Daily Queue

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Blog account key"
        required: true
        default: "temanju"
        type: choice
        options:
          - temanju
          - offnote_blog
  schedule:
    # KST 06:20 - prepare daily blog queues before publishing windows.
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: blog-daily-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate scripts
        run: |
          node --check scripts/blog_marketing_policy.mjs
          node --check scripts/generate_blog_daily_queue.mjs
          node --check scripts/validate_blog_daily_queue.mjs
          node --test scripts/test_blog_marketing_policy.mjs

      - name: Generate daily queues
        shell: bash
        run: |
          DATE="$(TZ=Asia/Seoul date +%F)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/generate_blog_daily_queue.mjs "${{ inputs.account }}" "$DATE"
          else
            node scripts/generate_blog_daily_queue.mjs temanju "$DATE"
            node scripts/generate_blog_daily_queue.mjs offnote_blog "$DATE"
          fi

      - name: Commit queue results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/blog
          git commit -m "Queue daily blog posts $(TZ=Asia/Seoul date +%F)" || true
          git pull --rebase
          git push
