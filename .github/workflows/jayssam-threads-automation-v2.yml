name: Jayssam Threads Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "preview"
        type: choice
        options:
          - metrics
          - draft
          - preview
          - verify_publish_path
          - publish
          - watchdog
      slot:
        description: "Posting slot"
        required: true
        default: "lunch"
        type: choice
        options:
          - lunch
          - afternoon
          - evening
          - night
      draft_path:
        description: "Optional draft JSON path for publish mode"
        required: false
        default: ""
  schedule:
    # KST 10:05 - collect previous reaction metrics.
    - cron: "5 1 * * *"
    # A single ten-minute cadence handles GitHub schedule delay and routes
    # the configured 15:00 and 21:00 KST slots at runtime.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: jayssam-threads-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
      CAREERNET_API_KEY: ${{ secrets.CAREERNET_API_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      THREADS_ACCOUNT_HANDLE: "@jayssam_edu"
      THREADS_AUTO_PUBLISH: "true"
      THREADS_SAFETY_MODE: "true"
      THREADS_DAILY_POST_LIMIT: "2"
      THREADS_MIN_INTERVAL_HOURS: "5"
      THREADS_PUBLISH_WAIT_MS: "30000"
      THREADS_VERIFY_PROFILE_BEFORE_PUBLISH: "true"
      THREADS_EXPECTED_USERNAME: "jayssam_edu"
      THREADS_REDIRECT_URI: "https://blog.naver.com/taemomjoo"
      THREADS_PUBLISH_LOG: "outputs/meta-publish-log.json"
      THREADS_OAUTH_SCOPES: "threads_basic,threads_content_publish,threads_manage_insights,threads_read_replies,threads_manage_replies"
      THREADS_REQUIRE_MEDIA: "false"
      THREADS_CAROUSEL_ENABLED: "false"
      THREADS_ALLOW_SINGLE_IMAGE_FALLBACK: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve mode and slot
        id: route
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
            SLOT="${{ inputs.slot }}"
            RUN="true"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            echo "run=$RUN" >> "$GITHUB_OUTPUT"
          else
            node scripts/github_resolve_run.mjs "${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create runtime env
        if: steps.route.outputs.run == 'true'
        run: node scripts/create_jayssam_github_env.mjs

      - name: Setup card image runtime
        if: steps.route.outputs.run == 'true' && false
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Validate scripts
        if: steps.route.outputs.run == 'true'
        run: |
          node --check scripts/collect_threads_metrics.mjs
          node --check scripts/github_resolve_run.mjs
          python -m py_compile scripts/generate_jayssam_daily_post.py
          python -m py_compile scripts/generate_jayssam_queue_post.py
          node --check scripts/send_telegram_preview.mjs
          node --check scripts/publish_latest_approved.mjs
          node --check scripts/threads_publish.mjs
          node --check scripts/use_github_raw_media.mjs
          node --check scripts/upload_cardnews_to_catbox.mjs
          node --check scripts/verify_media_urls.mjs
          node --check scripts/send_telegram_message.mjs
          node --check scripts/mark_jayssam_news_queue_posted.mjs
          node --check scripts/check_daily_publish_status.mjs
          node --test scripts/test_jayssam_schedule_routing.mjs

      - name: Collect Threads metrics
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'metrics'
        run: node scripts/collect_threads_metrics.mjs

      - name: Create draft queue
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'draft'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/send_telegram_preview.mjs

      - name: Send Telegram preview
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'preview'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/send_telegram_preview.mjs

      - name: Verify publish path without posting
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'verify_publish_path'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/upload_cardnews_to_catbox.mjs "$(cat outputs/automation/latest-draft-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/automation outputs/cards
          git commit -m "Verify Jayssam generated assets $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git push
          node scripts/verify_media_urls.mjs "$(cat outputs/automation/latest-draft-path.txt)"

      - name: Publish latest approved
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'publish'
        run: |
          if [[ -n "${{ inputs.draft_path }}" ]]; then
            DRAFT_PATH="${{ inputs.draft_path }}"
          else
            python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
            DRAFT_PATH="$(cat outputs/automation/latest-draft-path.txt)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DRAFT_PATH" outputs/automation outputs/cards
          git commit -m "Add generated Jayssam assets $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git pull --rebase --autostash origin master
          git push
          # Publish the text draft only; this path does not require card-media upload or URL verification.
          node scripts/publish_latest_approved.mjs "$DRAFT_PATH"
          node scripts/mark_jayssam_news_queue_posted.mjs "$DRAFT_PATH"
          node scripts/send_telegram_message.mjs "[?쒖씠??寃뚯떆 ?꾨즺] ${{ steps.route.outputs.slot }} ?щ’ 寃뚯떆 ?꾨즺"
          git add -f "$DRAFT_PATH" outputs/meta-publish-log.json content/jayssam-news-queue.csv
          git commit -m "Record Jayssam publish $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git pull --rebase --autostash origin master
          git push

      - name: Watch publish status
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'watchdog'
        # run: # run: run: node scripts/check_daily_publish_status.mjs "${{ steps.route.outputs.slot }}" # Disabled to stop Telegram spam # Disabled to stop Telegram spam

      - name: Notify failure
        if: failure()
        run: node scripts/send_telegram_message.mjs "[?쒖씠???먮룞???ㅽ뙣] mode=${{ steps.route.outputs.mode }} slot=${{ steps.route.outputs.slot }} run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
