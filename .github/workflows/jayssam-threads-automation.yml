name: Jayssam Threads Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "preview"
        type: choice
        options:
          - metrics
          - draft
          - preview
          - verify_publish_path
          - publish
          - watchdog
      slot:
        description: "Posting slot"
        required: true
        default: "lunch"
        type: choice
        options:
          - lunch
          - afternoon
          - evening
          - night
  schedule:
    # KST 10:05 - collect previous reaction metrics
    - cron: "5 1 * * *"
    # KST 15:00 post route: 12:00 preview, 15:00 publish.
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "20 6 * * *"
    # KST 21:00 post route from week 2: 18:00 preview, 21:00 publish.
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "20 12 * * *"

permissions:
  contents: write

concurrency:
  group: jayssam-threads-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SCHOOLINFO_API_KEY: ${{ secrets.SCHOOLINFO_API_KEY }}
      CAREERNET_API_KEY: ${{ secrets.CAREERNET_API_KEY }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      THREADS_ACCOUNT_HANDLE: "@jayssam_edu"
      THREADS_AUTO_PUBLISH: "true"
      THREADS_SAFETY_MODE: "true"
      THREADS_DAILY_POST_LIMIT: "2"
      THREADS_MIN_INTERVAL_HOURS: "6"
      THREADS_PUBLISH_WAIT_MS: "30000"
      THREADS_VERIFY_PROFILE_BEFORE_PUBLISH: "true"
      THREADS_EXPECTED_USERNAME: "jayssam_edu"
      THREADS_REDIRECT_URI: "https://blog.naver.com/taemomjoo"
      THREADS_PUBLISH_LOG: "outputs/meta-publish-log.json"
      THREADS_OAUTH_SCOPES: "threads_basic,threads_content_publish,threads_manage_insights"
      THREADS_REQUIRE_MEDIA: "true"
      THREADS_CAROUSEL_ENABLED: "true"
      THREADS_ALLOW_SINGLE_IMAGE_FALLBACK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve mode and slot
        id: route
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
            SLOT="${{ inputs.slot }}"
            RUN="true"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            echo "run=$RUN" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "5 1 * * *") echo "mode=metrics" >> "$GITHUB_OUTPUT"; echo "slot=lunch" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
              "0 3 * * *") echo "mode=preview" >> "$GITHUB_OUTPUT"; echo "slot=afternoon" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
              "0 6 * * *") echo "mode=publish" >> "$GITHUB_OUTPUT"; echo "slot=afternoon" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
              "20 6 * * *") echo "mode=watchdog" >> "$GITHUB_OUTPUT"; echo "slot=afternoon" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT" ;;
              "0 9 * * *") node scripts/github_phase_gate.mjs "preview" "night" >> "$GITHUB_OUTPUT" ;;
              "0 12 * * *") node scripts/github_phase_gate.mjs "publish" "night" >> "$GITHUB_OUTPUT" ;;
              "20 12 * * *") node scripts/github_phase_gate.mjs "watchdog" "night" >> "$GITHUB_OUTPUT" ;;
              *) node scripts/github_resolve_run.mjs "${{ github.event.schedule }}" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Create runtime env
        if: steps.route.outputs.run == 'true'
        run: node scripts/create_jayssam_github_env.mjs

      - name: Setup card image runtime
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode != 'metrics'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Validate scripts
        if: steps.route.outputs.run == 'true'
        run: |
          node --check scripts/collect_threads_metrics.mjs
          node --check scripts/github_resolve_run.mjs
          python -m py_compile scripts/generate_jayssam_daily_post.py
          node --check scripts/send_telegram_preview.mjs
          node --check scripts/publish_latest_approved.mjs
          node --check scripts/threads_publish.mjs
          node --check scripts/upload_cardnews_to_catbox.mjs
          node --check scripts/use_github_raw_media.mjs
          node --check scripts/verify_media_urls.mjs
          node --check scripts/send_telegram_message.mjs
          node --check scripts/check_daily_publish_status.mjs

      - name: Collect Threads metrics
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'metrics'
        run: node scripts/collect_threads_metrics.mjs

      - name: Create draft queue
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'draft'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/send_telegram_preview.mjs

      - name: Send Telegram preview
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'preview'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/send_telegram_preview.mjs

      - name: Verify publish path without posting
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'verify_publish_path'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/use_github_raw_media.mjs "$(cat outputs/automation/latest-draft-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/automation outputs/cards
          git commit -m "Verify Jayssam generated assets $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git push
          node scripts/verify_media_urls.mjs "$(cat outputs/automation/latest-draft-path.txt)"

      - name: Publish latest approved
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'publish'
        run: |
          python scripts/generate_jayssam_daily_post.py "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          node scripts/use_github_raw_media.mjs "$(cat outputs/automation/latest-draft-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/automation outputs/cards
          git commit -m "Add generated Jayssam assets $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git push
          node scripts/verify_media_urls.mjs "$(cat outputs/automation/latest-draft-path.txt)"
          node scripts/publish_latest_approved.mjs
          node scripts/send_telegram_message.mjs "[제이쌤 게시 완료] ${{ steps.route.outputs.slot }} 슬롯 게시 완료"
          git add -f outputs/meta-publish-log.json
          git commit -m "Record Jayssam publish $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git pull --rebase --autostash origin master
          git push

      - name: Watch publish status
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'watchdog'
        run: node scripts/check_daily_publish_status.mjs "${{ steps.route.outputs.slot }}"

      - name: Notify failure
        if: failure()
        run: node scripts/send_telegram_message.mjs "[제이쌤 자동화 실패] mode=${{ steps.route.outputs.mode }} slot=${{ steps.route.outputs.slot }} run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
