name: Threads Reply Autoresponder

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account to inspect"
        required: true
        default: "jayssam"
        type: choice
        options:
          - jayssam
          - lifemagazine
          - offnote
      dry_run:
        description: "Classify only; do not publish replies"
        required: true
        default: true
        type: boolean
  schedule:
    # KST hourly checks, spaced by account. The feature remains disabled until reply scopes are granted.
    - cron: "15 * * * *"
    - cron: "25 * * * *"
    - cron: "35 * * * *"

permissions:
  contents: write

concurrency:
  group: threads-reply-autoresponder
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      THREADS_REPLY_AUTORESPONDER_ENABLED: ${{ vars.THREADS_REPLY_AUTORESPONDER_ENABLED || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve account
        id: route
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "account=${{ inputs.account }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "15 * * * *") echo "account=jayssam" >> "$GITHUB_OUTPUT" ;;
            "25 * * * *") echo "account=lifemagazine" >> "$GITHUB_OUTPUT" ;;
            "35 * * * *") echo "account=offnote" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

      - name: Validate reply automation
        run: |
          node --check scripts/threads_reply_autoresponder.mjs
          node scripts/test_threads_reply_autoresponder.mjs

      - name: Run Jayssam reply automation
        if: steps.route.outputs.account == 'jayssam' && (github.event_name == 'workflow_dispatch' || env.THREADS_REPLY_AUTORESPONDER_ENABLED == 'true')
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="jayssam"
          if [[ "${{ steps.route.outputs.dry_run }}" == "true" ]]; then ARGS="$ARGS --dry-run"; fi
          node scripts/threads_reply_autoresponder.mjs $ARGS

      - name: Run Lifemagazine reply automation
        if: steps.route.outputs.account == 'lifemagazine' && (github.event_name == 'workflow_dispatch' || env.THREADS_REPLY_AUTORESPONDER_ENABLED == 'true')
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.LIFEMAGAZINE_THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: "me"
          LIFEMAGAZINE_TELEGRAM_BOT_TOKEN: ${{ secrets.LIFEMAGAZINE_TELEGRAM_BOT_TOKEN }}
          LIFEMAGAZINE_TELEGRAM_CHAT_ID: ${{ secrets.LIFEMAGAZINE_TELEGRAM_CHAT_ID }}
        run: |
          ARGS="lifemagazine"
          if [[ "${{ steps.route.outputs.dry_run }}" == "true" ]]; then ARGS="$ARGS --dry-run"; fi
          node scripts/threads_reply_autoresponder.mjs $ARGS

      - name: Run Offnote reply automation
        if: steps.route.outputs.account == 'offnote' && (github.event_name == 'workflow_dispatch' || env.THREADS_REPLY_AUTORESPONDER_ENABLED == 'true')
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.OFFNOTE_THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: "me"
          OFFNOTE_TELEGRAM_BOT_TOKEN: ${{ secrets.OFFNOTE_TELEGRAM_BOT_TOKEN }}
          OFFNOTE_TELEGRAM_CHAT_ID: ${{ secrets.OFFNOTE_TELEGRAM_CHAT_ID }}
        run: |
          ARGS="offnote"
          if [[ "${{ steps.route.outputs.dry_run }}" == "true" ]]; then ARGS="$ARGS --dry-run"; fi
          node scripts/threads_reply_autoresponder.mjs $ARGS

      - name: Commit reply state
        if: github.event_name == 'workflow_dispatch' || env.THREADS_REPLY_AUTORESPONDER_ENABLED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/reply-management
          if git diff --cached --quiet; then
            echo "No reply-state changes."
          else
            git commit -m "Record Threads reply handling $(TZ=Asia/Seoul date +%F-%H%M)"
            git pull --rebase
            git push
          fi

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ steps.route.outputs.account == 'jayssam' && secrets.TELEGRAM_BOT_TOKEN || steps.route.outputs.account == 'lifemagazine' && secrets.LIFEMAGAZINE_TELEGRAM_BOT_TOKEN || secrets.OFFNOTE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ steps.route.outputs.account == 'jayssam' && secrets.TELEGRAM_CHAT_ID || steps.route.outputs.account == 'lifemagazine' && secrets.LIFEMAGAZINE_TELEGRAM_CHAT_ID || secrets.OFFNOTE_TELEGRAM_CHAT_ID }}
        run: |
          node -e "const f=new FormData();f.set('chat_id',process.env.TELEGRAM_CHAT_ID);f.set('text','[Threads 대댓글 자동화 확인 필요] account=${{ steps.route.outputs.account }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');fetch('https://api.telegram.org/bot'+process.env.TELEGRAM_BOT_TOKEN+'/sendMessage',{method:'POST',body:f})"
