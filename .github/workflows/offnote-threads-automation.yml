name: Offnote Threads Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "auto_publish"
        type: choice
        options:
          - preview
          - auto_publish
          - delete_post
          - health
      slot:
        description: "Posting slot"
        required: true
        default: "evening"
        type: choice
        options:
          - evening
          - night
      post_ids:
        description: "Comma-separated Threads post IDs to delete in delete_post mode"
        required: false
        type: string
  schedule:
    # GitHub Actions runs on a 5-minute cadence. The runtime schedule in
    # config/offnote-schedule.json decides whether this run previews,
    # publishes, checks health, or exits without doing work.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: offnote-threads-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.OFFNOTE_THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: "me"
      THREADS_APP_ID: ${{ secrets.OFFNOTE_THREADS_APP_ID }}
      THREADS_APP_SECRET: ${{ secrets.OFFNOTE_THREADS_APP_SECRET }}
      THREADS_ACCOUNT_HANDLE: "@offnote.kr"
      THREADS_AUTO_PUBLISH: "true"
      THREADS_SAFETY_MODE: "true"
      THREADS_DAILY_POST_LIMIT: "2"
      THREADS_MIN_INTERVAL_HOURS: "2.5"
      THREADS_PUBLISH_WAIT_MS: "30000"
      THREADS_VERIFY_PROFILE_BEFORE_PUBLISH: "true"
      THREADS_EXPECTED_USERNAME: "offnote.kr"
      THREADS_PUBLISH_LOG: "outputs/afterwork-profit/meta-publish-log.json"
      THREADS_REQUIRE_MEDIA: "false"
      THREADS_CAROUSEL_ENABLED: "false"
      OFFNOTE_TELEGRAM_BOT_TOKEN: ${{ secrets.OFFNOTE_TELEGRAM_BOT_TOKEN }}
      OFFNOTE_TELEGRAM_CHAT_ID: ${{ secrets.OFFNOTE_TELEGRAM_CHAT_ID }}
      OFFNOTE_TELEGRAM_DRY_RUN: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Process Telegram commands and manual records
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/telegram_check_offnote_approvals.mjs

      - name: Commit Telegram input and schedule changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f config/offnote-schedule.json outputs/afterwork-profit/offnote-daily-facts outputs/afterwork-profit/telegram-approval-state.json outputs/afterwork-profit/automation/offnote-telegram-approval-checker-last-error.json || true
          if git diff --cached --quiet; then
            echo "No Telegram input or schedule change to commit."
          else
            git commit -m "Record Offnote Telegram input and schedule settings"
            git pull --rebase
            git push
          fi

      - name: Resolve mode
        id: route
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/offnote_schedule.mjs | tee /tmp/offnote-route.txt
          grep '^mode=' /tmp/offnote-route.txt >> "$GITHUB_OUTPUT"
          grep '^slot=' /tmp/offnote-route.txt >> "$GITHUB_OUTPUT"
          mode="$(grep '^mode=' /tmp/offnote-route.txt | cut -d= -f2-)"
          if [[ "$mode" == "skip" ]]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - name: Setup card image runtime
        if: steps.route.outputs.run == 'true' && false
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Validate scripts
        if: steps.route.outputs.run == 'true'
        run: |
          node --check scripts/offnote_schedule.mjs
          node --check scripts/telegram_check_offnote_approvals.mjs
          node --check scripts/generate_offnote_daily_post.mjs
          node --check scripts/publish_offnote_due.mjs
          node --check scripts/send_offnote_auto_publish_notice.mjs
          node --check scripts/threads_publish.mjs
          node --check scripts/delete_threads_posts.mjs
          node --check scripts/use_github_raw_media.mjs
          node --check scripts/verify_media_urls.mjs
          node --check scripts/check_offnote_automation_health.mjs
          node --check scripts/test_offnote_automation_guards.mjs
          node --check scripts/prepare_offnote_daily_facts.mjs
          node --check scripts/send_offnote_auto_publish_notice.mjs
          node --check scripts/test_offnote_telegram_controls.mjs
          node scripts/test_offnote_automation_guards.mjs
          node scripts/test_offnote_telegram_controls.mjs
          python -m py_compile scripts/generate_offnote_cardnews.py

      - name: Create automatic publishing draft
        id: preview
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'preview'
        run: |
          node scripts/generate_offnote_daily_post.mjs "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          echo "created=$(cat outputs/afterwork-profit/preview-created.txt)" >> "$GITHUB_OUTPUT"
          if [[ "$(cat outputs/afterwork-profit/preview-created.txt)" != "true" ]]; then
            echo "Existing draft found; preview generation skipped."
            exit 0
          fi
          DRAFT_PATH="$(cat outputs/afterwork-profit/latest-draft-path.txt)"
          DRAFT_STATUS="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).status)" "$DRAFT_PATH")"
          node scripts/validate_offnote_draft.mjs "$DRAFT_PATH"
          if [[ "$DRAFT_STATUS" == "held_missing_detail" || "$DRAFT_STATUS" == "held_validation_failed" ]]; then
            echo "Offnote slot intentionally held: $DRAFT_STATUS"
            exit 0
          fi
          node scripts/send_offnote_auto_publish_notice.mjs "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          echo "Cardnews skipped by default. Generate manually only for high-density posts."

      - name: Commit generated draft before automatic publishing
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'preview' && steps.preview.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/afterwork-profit
          git commit -m "Add Offnote preview assets $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
          git pull --rebase
          git push

      - name: Attach GitHub raw media URLs
        if: steps.route.outputs.run == 'true' && false
        run: |
          node scripts/use_github_raw_media.mjs "$(cat outputs/afterwork-profit/latest-draft-path.txt)"
          node scripts/verify_media_urls.mjs "$(cat outputs/afterwork-profit/latest-draft-path.txt)"

      - name: Ensure due Offnote draft assets
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'auto_publish'
        run: |
          node scripts/generate_offnote_daily_post.mjs "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"
          if [[ "$(cat outputs/afterwork-profit/preview-created.txt)" == "true" ]]; then
            DRAFT_PATH="$(cat outputs/afterwork-profit/latest-draft-path.txt)"
            DRAFT_STATUS="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).status)" "$DRAFT_PATH")"
            node scripts/validate_offnote_draft.mjs "$DRAFT_PATH"
            if [[ "$DRAFT_STATUS" == "held_missing_detail" || "$DRAFT_STATUS" == "held_validation_failed" ]]; then
              echo "Offnote slot intentionally held: $DRAFT_STATUS"
              exit 0
            fi
            echo "Cardnews skipped by default. Publishing text and reply comments only."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            DRAFT_PATH="$(cat outputs/afterwork-profit/latest-draft-path.txt)"
            git add -f "$DRAFT_PATH" outputs/afterwork-profit/latest-draft-path.txt outputs/afterwork-profit/preview-created.txt
            git commit -m "Add Offnote auto-publish assets $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
            git pull --rebase
            git push
            git add -f "$DRAFT_PATH" outputs/afterwork-profit/latest-draft-path.txt
            git commit -m "Prepare Offnote auto-publish draft $(TZ=Asia/Seoul date +%F)-${{ steps.route.outputs.slot }}" || true
            git pull --rebase
            git push
          fi

      - name: Notify scheduled Offnote post
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'auto_publish'
        run: node scripts/send_offnote_auto_publish_notice.mjs "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"

      - name: Auto-publish due Offnote draft
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'auto_publish'
        run: node scripts/publish_offnote_due.mjs "$(TZ=Asia/Seoul date +%F)" "${{ steps.route.outputs.slot }}"

      - name: Manual publish latest Offnote draft
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'manual_publish'
        run: |
          DRAFT_PATH="$(cat outputs/afterwork-profit/latest-draft-path.txt | tr '\\' '/')"
          DRAFT_STATUS="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).status)" "$DRAFT_PATH")"
          if [[ "$DRAFT_STATUS" != "approved" && "$DRAFT_STATUS" != "pending_approval" ]]; then
            echo "Offnote manual publish requires approved or pending_approval draft, got $DRAFT_STATUS"
            exit 1
          fi
          node scripts/validate_offnote_draft.mjs "$DRAFT_PATH"
          THREADS_REQUIRE_MEDIA=false THREADS_DAILY_POST_LIMIT=2 THREADS_MIN_INTERVAL_HOURS=2.5 node scripts/threads_publish.mjs "$DRAFT_PATH"
          node -e "const fs=require('fs');const p=process.argv[1];const d=JSON.parse(fs.readFileSync(p,'utf8').replace(/^\uFEFF/,''));d.status='published';d.published_at=new Date().toISOString();d.manual_publish=true;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n','utf8');" "$DRAFT_PATH"

      - name: Delete Offnote Threads posts
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'delete_post'
        run: |
          if [[ -z "${{ inputs.post_ids }}" ]]; then
            echo "post_ids is required for delete_post mode"
            exit 1
          fi
          node scripts/delete_threads_posts.mjs "${{ inputs.post_ids }}"

      - name: Commit approval check results
        if: steps.route.outputs.run == 'true' && (steps.route.outputs.mode == 'auto_publish' || steps.route.outputs.mode == 'delete_post')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f outputs/afterwork-profit/latest-draft-path.txt ]]; then
            git add -f "$(cat outputs/afterwork-profit/latest-draft-path.txt)" outputs/afterwork-profit/latest-draft-path.txt || true
          fi
          git add -f outputs/afterwork-profit/preview-created.txt outputs/afterwork-profit/meta-publish-log.json outputs/afterwork-profit/telegram-approval-state.json || true
          if [[ -f outputs/afterwork-profit/automation/offnote-telegram-approval-checker-last-error.json ]]; then
            git add -f outputs/afterwork-profit/automation/offnote-telegram-approval-checker-last-error.json
          fi
          if git diff --cached --quiet; then
            git status --short
          else
            git commit -m "Record Offnote automatic publish $(TZ=Asia/Seoul date +%F-%H%M)"
            git pull --rebase
            git push
          fi

      - name: Health watchdog
        if: steps.route.outputs.run == 'true' && steps.route.outputs.mode == 'health'
        run: node scripts/check_offnote_automation_health.mjs

      - name: Notify failure
        if: failure()
        run: |
          node -e "const f=new FormData();f.set('chat_id',process.env.OFFNOTE_TELEGRAM_CHAT_ID);f.set('text','[오프노트 자동화 확인 필요]\nmode=${{ steps.route.outputs.mode }} slot=${{ steps.route.outputs.slot }}\nrun=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}');f.set('disable_web_page_preview','true');fetch('https://api.telegram.org/bot'+process.env.OFFNOTE_TELEGRAM_BOT_TOKEN+'/sendMessage',{method:'POST',body:f})"
